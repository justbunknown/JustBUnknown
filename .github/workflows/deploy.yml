name: Deploy JustBUnknown Production App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04 # ◄— Pinned to stable image to bypass unstable Ubuntu 26 rollout logs
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24 # ◄— Upgraded to active non-deprecated LTS runtime

      - name: Install System Dependencies
        run: npm install # ◄— Switched from 'ci' to clean fallback install to handle uncommitted lockfiles

      - name: Compile Distribution Target (Vite Build)
        run: npm run build

      - name: Upload Static Web Production Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy Live Asset to GitHub Pages Tier
        id: deployment
        uses: actions/deploy-pages@v4
